# Proposed fdroiddata metadata for HelmChatRisen 1.7 (release tag V1.7).
# Copy this file to fdroiddata/metadata/dev.communicator.helmchatrisen.yml
# before opening the inclusion merge request. See fdroid/README.md in this repo.
# F-Droid publishes only the arm64-v8a package (version code 700).

Categories:
  - Connectivity
  - Internet

AuthorName: HelmChatRisen contributors
License: MIT
SourceCode: https://github.com/bleciej/HelmChatRisen
IssueTracker: https://github.com/bleciej/HelmChatRisen/issues
Changelog: https://github.com/bleciej/HelmChatRisen/blob/HEAD/RELEASE_NOTES.md

RepoType: git
Repo: https://github.com/bleciej/HelmChatRisen

MaintainerNotes: |
  The Jitsi Meet SDK is built from source with LIBRE_BUILD=true before the app
  build; no prebuilt Jitsi AAR is consumed. Node.js 24.22.3 is downloaded with a
  pinned SHA-256 because the buildserver base image does not ship Node 24.
  Two JDKs are needed: 17 for Jitsi's Gradle toolchain and 21 for the app's
  Gradle 9.6/AGP 9.5.2 build. scripts/fdroid-install-deps.sh installs both and
  also installs the checksum-pinned Gradle 9.6 distribution on PATH, because
  the buildserver's system Gradle is older. scripts/fdroid-build.sh performs
  the pinned Node bootstrap, SDK build and app build. The Jitsi npm install
  needs several GiB of disk.
  Only arm64-v8a is submitted: compiling the 32-bit variant would repeat the
  long Jitsi SDK/npm build without adding a supported rider device class.
  The commit below is the final V1.7 release commit on master
  (3e2f332109e973e2a630472bf0595eae1ba642ac). Upstream appVersionCode is 7, so
  the VercodeOperation below derives F-Droid code 700 for arm64-v8a.
  prebuild replaces ./gradlew with gradle on PATH because F-Droid removes the
  Gradle wrapper from the source archive.

Builds:
  - versionName: '1.7'
    versionCode: 700
    commit: 3e2f332109e973e2a630472bf0595eae1ba642ac
    timeout: 14400
    sudo: ./scripts/fdroid-install-deps.sh
    output: app/build/outputs/apk/release/HelmChatRisen-*-release-arm64-v8a.apk
    prebuild:
      - sed -i "s/val appVersionCode = [0-9]*/val appVersionCode = $$VERCODE$$/" app/build.gradle.kts
      - sed -i 's#\./gradlew#gradle#' scripts/fdroid-build.sh
    build: ./scripts/fdroid-build.sh

AutoUpdateMode: Version
UpdateCheckMode: Tags V*
UpdateCheckData: 'app/build.gradle.kts|val appVersionCode\s*=\s*(\d+)||val appVersionName\s*=\s*"([^"]+)"'
VercodeOperation:
  - 100 * %c
CurrentVersion: '1.7'
CurrentVersionCode: 700
